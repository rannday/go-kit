version: "2"

run:
  # Timeout for running linters
  timeout: 5m
  # Exit code when issues are found
  issues-exit-code: 1
  # Include test files in linting
  tests: true

linters:
  # Disable default linter set to explicitly control enabled linters
  default: none
  enable:
    # Core correctness and bugs
    - errcheck      # Checks for unhandled errors
    - govet         # Examines Go source code and reports suspicious constructs
    - staticcheck   # Advanced static analysis checks
    - unused        # Checks for unused constants, variables, functions and types
    - ineffassign   # Detects ineffectual assignments

    # Code quality and performance
    - bodyclose     # Checks whether HTTP response body is closed successfully
    - goconst       # Finds repeated strings that could be replaced by a constant
    - gocritic      # Provides diagnostics that check for bugs, performance and style issues
    - revive        # Fast, configurable, extensible linter for Go (drop-in replacement for golint)
    - unconvert     # Removes unnecessary type conversions

  settings:
    govet:
      # Preserve all vet analyzers except fieldalignment.
      enable-all: true
      disable:
        - fieldalignment # Avoid strict memory layout noise unless optimizing
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    # Preserve the vendor-directory exclusion.
    paths:
      - vendor
    # Relax errcheck and goconst only for test files.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst

formatters:
  # v2 runs formatting checks in the formatter section, not as linters.
  enable:
    - gofmt
    - goimports

issues:
  # Maximum issues count per same linter (0 = unlimited)
  max-issues-per-linter: 0
  # Maximum count of issues with the same text (0 = unlimited)
  max-same-issues: 0
