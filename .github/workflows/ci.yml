name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: logx, go: '1.26.x', staticcheck: v0.8.1, golangci: true}
          - {module: logx, go: '1.21.x', staticcheck: '', golangci: false}
          - {module: envx, go: '1.26.x', staticcheck: v0.7.0, golangci: true}
          - {module: envx, go: '1.18.x', staticcheck: '', golangci: false}
          - {module: confx, go: '1.26.x', staticcheck: v0.8.1, golangci: true}
          - {module: confx, go: '1.23.x', staticcheck: '', golangci: false}
          - {module: buildx, go: '1.26.x', staticcheck: v0.8.1, golangci: true}
          - {module: buildx, go: '1.18.x', staticcheck: '', golangci: false}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: modules/${{ matrix.module }}/go.*
      - name: Format, tidy, test, race, build, vet
        run: bash scripts/test-all.sh --module "$MODULE" --race
        env:
          MODULE: ${{ matrix.module }}
      - uses: dominikh/staticcheck-action@v1
        if: matrix.staticcheck != ''
        with:
          version: ${{ matrix.staticcheck }}
          install-go: false
          working-directory: modules/${{ matrix.module }}
      - uses: golangci/golangci-lint-action@v9
        if: matrix.golangci
        with:
          version: v2.14.0
          working-directory: modules/${{ matrix.module }}
          args: --config=../../.golangci.yml --timeout=5m

  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: modules/**/go.*
      - run: bash scripts/test-all.sh --workspace --race
      - name: External consumer and real cross-compilation
        run: go run scripts/verify-consumer.go
      - name: Validate release guards
        run: |
          for module in logx envx confx buildx; do
            bash scripts/validate-release.sh "$module" v0.1.0 --inputs-only >/dev/null
          done
          if bash scripts/validate-release.sh invalid v0.1.0; then exit 1; fi
          if bash scripts/validate-release.sh logx v2.0.0; then exit 1; fi
          if bash scripts/validate-release.sh logx 'v0.1.0;echo injected'; then exit 1; fi
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: modules/**/go.*
      - shell: pwsh
        run: ./scripts/test-all.ps1 -Race
